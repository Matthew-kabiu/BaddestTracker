# Production: sh scripts/compose.sh production up --build -d --wait
# .env.production is the sole source; missing variables abort startup.
# Host Cloudflare Tunnel -> frontend gateway -> internal auth/backend; DB stays private.
name: baddest-tracker

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${POSTGRES_PORT:?set in .env.production}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_PORT: ${POSTGRES_PORT:?set in .env.production}
    # No published port: only reachable on the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${POSTGRES_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    restart: unless-stopped

  auth:
    build:
      context: ./code/auth
      dockerfile: docker/Dockerfile.prod
    environment:
      APP_ENV: ${APP_ENV:?set in .env.production}
      AUTH_PORT: ${AUTH_PORT:?set in .env.production}
      DATABASE_URL: ${DATABASE_URL:?set in .env.production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env.production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set in .env.production}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?set in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${AUTH_PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.1", memory: 64M }
    restart: unless-stopped

  backend:
    build:
      context: ./code/backend
      dockerfile: docker/Dockerfile.prod
    environment:
      APP_ENV: ${APP_ENV:?set in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:?set in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env.production}
      BACKEND_PORT: ${BACKEND_PORT:?set in .env.production}
      DATABASE_URL: ${DATABASE_URL:?set in .env.production}
      DB_MAX_CONNS: ${DB_MAX_CONNS:?set in .env.production}
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:?set in .env.production}
      AI_KEYS_ENCRYPTION_KEY: ${AI_KEYS_ENCRYPTION_KEY:?set in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1", memory: 256M }
        reservations: { cpus: "0.25", memory: 64M }
    restart: unless-stopped

  frontend:
    build:
      context: ./code/frontend
      dockerfile: docker/Dockerfile.prod
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:?set in .env.production}
      BACKEND_PORT: ${BACKEND_PORT:?set in .env.production}
      AUTH_PORT: ${AUTH_PORT:?set in .env.production}
      SITE_URL: ${SITE_URL:?set in .env.production}
      NGINX_ENVSUBST_FILTER: '^(FRONTEND_PORT|BACKEND_PORT|AUTH_PORT|SEO_CSP_HASH)$'
    ports:
      - "${HOST_BIND_ADDRESS:?set in .env.production}:${FRONTEND_HOST_PORT:?set in .env.production}:${FRONTEND_PORT:?set in .env.production}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${FRONTEND_PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
        reservations: { cpus: "0.1", memory: 32M }
    restart: unless-stopped

volumes:
  postgres_data:
