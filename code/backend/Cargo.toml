[package]
name = "baddest-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
envy = "0.4.2"
migration = { version = "0.1.0", path = "migration" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5.3"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout", "request-id", "set-header", "catch-panic", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[workspace]
members = [".", "migration"]

# Rust template §8.2 / §23: no unwrap/expect on the request path. `main` startup and tests
# may opt out locally with #[allow] plus a comment saying why.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
