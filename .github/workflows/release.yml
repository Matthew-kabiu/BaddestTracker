# Baddest Tracker release — runs only when a version tag (v1.2.3) is pushed.
# Builds each service image once, publishes it to GHCR and opens a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/matthew-kabiu/baddesttracker

jobs:
  images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, auth]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: code/${{ matrix.service }}
          file: code/${{ matrix.service }}/docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Smoke test the published image with runtime configuration only
        if: matrix.service == 'frontend'
        run: |
          image="${IMAGE_PREFIX}-frontend:${GITHUB_REF_NAME#v}"
          docker run -d --name smoke -p 8080:8080 \
            --add-host auth:127.0.0.1 --add-host backend:127.0.0.1 \
            -e FRONTEND_PORT=8080 -e BACKEND_PORT=1 -e AUTH_PORT=1 \
            -e SITE_URL=https://release.invalid \
            -e 'NGINX_ENVSUBST_FILTER=^(FRONTEND_PORT|BACKEND_PORT|AUTH_PORT|SEO_CSP_HASH)$' \
            "$image"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -F 'rel="canonical" href="https://release.invalid/"'
          curl -fsS http://localhost:8080/robots.txt | grep -F 'Sitemap: https://release.invalid/sitemap.xml'
          curl -fsSI http://localhost:8080/ | grep -iE "^content-security-policy:.*'sha256-[A-Za-z0-9+/]{43}='"
          docker logs smoke
          docker rm -f smoke

  release:
    name: Create GitHub Release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "$(printf 'Images (linux/amd64):\n- `%s-frontend:%s`\n- `%s-backend:%s`\n- `%s-auth:%s`\n\nRun: see the README quickstart (`docker compose pull && docker compose up -d`).' "$IMAGE_PREFIX" "$version" "$IMAGE_PREFIX" "$version" "$IMAGE_PREFIX" "$version")"
